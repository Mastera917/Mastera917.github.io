<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reacción MMA</title>
    <!-- Conecta el archivo de configuración para la App (PWA) -->
    <link rel="manifest" href="manifest.json">
    <!-- Conecta los estilos visuales -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Asalto de Reacción</h1>
    <!-- Muestra el round actual y el total -->
    <h2>Asalto: <span id="roundDisplay">1</span> / <span id="totalRoundsDisplay">1</span></h2>
    <div id="clock">03:00</div>
    <div class="stats">Patadas lanzadas: <strong id="counter" style="color: white;">0</strong></div>
    
    <div class="controls">
        <button id="startBtn">Iniciar</button>
        <button id="pauseBtn">Pausar</button>
        <button id="resetBtn">Reiniciar</button>
    
<!-- Reemplaza tu div de controles de rounds por este: -->
        <label>Tiempo (seg): <input type="number" id="timeInput" value="180" min="10"></label>
        &nbsp;&nbsp;
        <label>Rounds: <input type="number" id="roundsInput" value="3" min="1"></label>
        &nbsp;&nbsp;
        <label>Descanso (seg): <input type="number" id="restInput" value="60" min="0"></label>
    
    </div>
    
    <div class="controls">
        <label>Min (seg): <input type="number" id="minInt" value="2" min="1"></label>
        &nbsp;&nbsp;
        <label>Max (seg): <input type="number" id="maxInt" value="6" min="2"></label>
    </div>
    
    <div class="controls">
        <label>Volumen: <input type="range" id="vol" min="0" max="1" step="0.1" value="1"></label>
        <br><br>
        <button id="testBtn">Probar Chicharra</button>
    </div>

    <!-- Conecta la lógica al final del body -->
    <script src="app.js"></script>
</body>
</html>
